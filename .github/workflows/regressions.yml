name: Shell regressions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
      - name: Install regression tools
        run: sudo apt-get update && sudo apt-get install -y fdisk busybox gcc openssl python3-cryptography
      - name: Run host-side regression tests
        run: python3 -m unittest discover -s tests -v
