name: Shell regressions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sparse-image partition test tool
        run: sudo apt-get update && sudo apt-get install -y fdisk
      - name: Run host-side regression tests
        run: python3 -m unittest discover -s tests -v
