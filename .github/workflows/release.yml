name: Publish Release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build-Test run for this exact main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
      - name: Require successful validation of this exact commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > build-run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('build-run.json'))
          checks = (
              (run['head_sha'] == os.environ['GITHUB_SHA'], 'Build commit differs from release source'),
              (run['head_repository']['full_name'] == os.environ['GH_REPO'], 'Build is from another repository'),
              (run['path'] == '.github/workflows/makefile.yml', 'Expected Build-Test workflow'),
              (run['status'] == 'completed' and run['conclusion'] == 'success', 'Build did not pass'),
              (run['event'] in ('push', 'workflow_dispatch'), 'Release requires a trusted branch build'),
          )
          for valid, message in checks:
              if not valid:
                  raise SystemExit(message)
          PY
      - name: Download and verify the validated assets
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN_ID" --name "LSCamoflash-release-$GITHUB_SHA" --dir release
          cd release
          sha256sum --strict --check SHA256SUMS
      - name: Publish the version and changelog
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < SOURCE/version.txt)"
          [[ "$version" =~ ^1\.[0-9]{2}\.[0-9]{4}$ ]]
          grep -F "## [$version]" CHANGELOG.md
          gh api "repos/$GH_REPO/git/matching-refs/tags/v$version" > tag-refs.json
          VERSION="$version" python3 - <<'PY'
          import json, os
          refs = json.load(open('tag-refs.json'))
          if any(ref['ref'] == 'refs/tags/v' + os.environ['VERSION'] for ref in refs):
              raise SystemExit('Version tag already exists')
          PY
          gh release create "v$version" release/* \
            --target "$GITHUB_SHA" \
            --title "LSCamoflash $version" \
            --notes-file CHANGELOG.md \
            --latest
