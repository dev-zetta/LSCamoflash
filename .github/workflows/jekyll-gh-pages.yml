name: Deploy Autobuild & GitHub Pages

on:
  # Publishing is explicit in this fork; Build-Test produces reviewable archives.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24

      - name: Installiere Build-Tools
        run: sudo apt update && sudo apt install -y build-essential flex bison gsoap binutils make automake autoconf autoconf-archive

      - name: Download der Quellen
        run: |
          cd SOURCE
          make mrproper-full download

      - name: Starte Build mit all-and-optionals
        run: |
          cd SOURCE
          make all-and-optionals

      - name: Release erstellen
        run: |
          cd SOURCE
          make release
          mkdir -p ../docs/autobuild
          cp LSCamoflash-*-uclibc.tar.gz ../docs/autobuild/LSCamoflash-Autobuild.tar.gz

      - name: Update erstellen
        run: |
          cd SOURCE
          make update
          mkdir -p ../docs/autobuild
          cp update-*-uclibc.tgz ../docs/autobuild/update-autobuild.tgz

      - name: Pages einrichten
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0; Node 24

      - name: Pages Build mit Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13; Docker
        with:
          source: ./docs
          destination: ./_site

      - name: Artefakt upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0; Node 24 uploader

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1; Node 24
