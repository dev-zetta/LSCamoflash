name: Build-Test

on:
  push:
    branches: [main]
    paths: ['SOURCE/**', 'tools/firmware-backup/**', 'tools/fullhan/**', 'tools/yyos/**', 'tests/**', 'CHANGELOG.md', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['SOURCE/**', 'tools/firmware-backup/**', 'tools/fullhan/**', 'tools/yyos/**', 'tests/**', 'CHANGELOG.md', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential busybox fdisk flex bison gsoap binutils make cmake python3 python3-cryptography automake autoconf autoconf-archive qemu-user openssl
      - name: Build default ARM uclibc packages and archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/logs
          cd SOURCE
          make nproc=8 all backup-kit release update 2>&1 | tee ../.local/logs/build.log
      - name: Verify packaged ARM programs and archives
        run: python3 SOURCE/src/bin/verify-build.py --output .local/logs/artifact-verification.json
      - name: Build separate credential-free Fullhan management and ONVIF with ARM1176 smoke
        env:
          QEMU_ARM: /usr/bin/qemu-arm
        run: make -C SOURCE fullhan-busybox-kit fullhan-onvif-kit fullhan-kit FULLHAN_ONVIF_KIT="${{ github.workspace }}/SOURCE/fullhan-onvif"
      - name: Build separate credential-free YYOS management with ARM926 smoke
        run: python3 tools/yyos/build-kit.py --output SOURCE/yyos-kit --busybox SOURCE/backup-kit/card/busybox --qemu /usr/bin/qemu-arm
      - name: Build separate credential-free YYOS optional SSH and complete installer package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SOURCE/yyos-inputs
          curl --fail --location --retry 3 https://musl.libc.org/releases/musl-1.2.6.tar.gz -o SOURCE/yyos-inputs/musl-1.2.6.tar.gz
          curl --fail --location --retry 3 https://matt.ucc.asn.au/dropbear/releases/dropbear-2026.94.tar.bz2 -o SOURCE/yyos-inputs/dropbear-2026.94.tar.bz2
          python3 tools/yyos/build-musl.py --source SOURCE/yyos-inputs/musl-1.2.6.tar.gz --output SOURCE/yyos-musl --qemu /usr/bin/qemu-arm
          python3 tools/yyos/build-dropbear.py --source SOURCE/yyos-inputs/dropbear-2026.94.tar.bz2 --musl-build SOURCE/yyos-musl --output SOURCE/yyos-dropbear --qemu /usr/bin/qemu-arm
          python3 tools/yyos/build-ssh-kit.py --credential-free --dropbear SOURCE/yyos-dropbear/bin/dropbear --dropbear-source SOURCE/yyos-dropbear/dropbear-2026.94.tar.bz2 --dropbear-provenance SOURCE/yyos-dropbear/provenance.json --musl-build SOURCE/yyos-musl --busybox SOURCE/backup-kit/card/busybox --qemu /usr/bin/qemu-arm --output SOURCE/yyos-ssh-kit
          python3 tools/yyos/package-kit.py --management-kit SOURCE/yyos-kit --ssh-kit SOURCE/yyos-ssh-kit --dropbear-build SOURCE/yyos-dropbear --musl-build SOURCE/yyos-musl --output SOURCE/yyos-release-kit
      - name: Run regressions with ARM926 BusyBox ash and backup tools
        env:
          CAMOFLASH_RUNTIME_SHELL: /usr/bin/qemu-arm -cpu arm926 ${{ github.workspace }}/SOURCE/build/mmcblk0p2/HACK/bin/busybox ash
          BACKUP_ARM_CC: ${{ github.workspace }}/SOURCE/toolchain/uclibc/bin/arm-buildroot-linux-uclibcgnueabi-gcc
          BACKUP_ARM_BUSYBOX: ${{ github.workspace }}/SOURCE/build/mmcblk0p2/HACK/bin/busybox
          BACKUP_QEMU: /usr/bin/qemu-arm
          FULLHAN_ONVIF_BIN: ${{ github.workspace }}/SOURCE/fullhan-onvif/bin/onvif_srvd
          FULLHAN_ONVIF_QEMU: /usr/bin/qemu-arm
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee .local/logs/regressions.log
      - name: Prepare versioned release assets and source bundle
        run: python3 SOURCE/src/bin/prepare-release.py --output release
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: build-log
          include-hidden-files: true
          path: |
            .local/logs/build.log
            .local/logs/artifact-verification.json
            .local/logs/regressions.log
      - name: Upload firmware archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: LSCamoflash-uclibc
          path: |
            SOURCE/LSCamoflash-*-uclibc.tar.gz
            SOURCE/update-*-uclibc.tgz
          if-no-files-found: error
      - name: Upload separate firmware backup kit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: LSCamoflash-nor-backup-kit
          path: SOURCE/backup-kit/
          if-no-files-found: error
      - name: Upload separate experimental Fullhan pilot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: LSCamoflash-fullhan-pilot
          path: SOURCE/fullhan-kit/
          if-no-files-found: error
      - name: Upload validated release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: LSCamoflash-release-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
